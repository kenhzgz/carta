name: Build APK desde la nube

on:
  workflow_dispatch: # Esto te permite iniciar la compilación manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 3. Configurar Java (necesario para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Instalar dependencias de la app
        run: npm ci

      - name: 5. Compilar la app web (React/Vite)
        run: npm run build

      - name: 6. Instalar y configurar Capacitor en la nube
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MiApp" "com.tuapp.id" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: 7. Construir el APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Guardar el APK para que lo descargues
        uses: actions/upload-artifact@v4
        with:
          name: mi-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
