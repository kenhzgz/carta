<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#27272a" stroke-width="3"/>
  <rect x="40" y="40" width="432" height="432" rx="76" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Center Menu / Letter C Branding -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Stylized Plate / Menu Cloche Silhouette Ring -->
    <circle r="160" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="720 180" transform="rotate(-40)"/>
    
    <!-- Central Bold "C" with Chef / Menu Flair -->
    <path d="M 60,-80 C 40,-120 -10,-130 -60,-110 C -120,-85 -140,-20 -140,20 C -140,80 -100,130 -40,135 C 15,140 60,110 75,70 C 80,55 70,45 55,45 C 45,45 38,50 32,65 C 22,88 -10,105 -42,100 C -82,95 -105,55 -105,15 C -105,-25 -85,-70 -48,-85 C -20,-96 20,-88 38,-65 C 46,-55 58,-55 64,-65 C 68,-70 65,-75 60,-80 Z" fill="url(#goldGrad)"/>
    
    <!-- Fork & Knife minimalist icon accent -->
    <g transform="translate(70, -20) scale(0.9)">
      <!-- Fork -->
      <path d="M-20,-45 L-20,-10 C-20,0 -12,8 -2,8 L-2,50 L4,50 L4,8 C14,8 22,0 22,-10 L22,-45 L17,-45 L17,-15 C17,-8 14,-4 9,-4 L9,-45 L4,-45 L4,-4 L-7,-4 L-7,-45 L-12,-45 L-12,-4 C-17,-4 -20,-8 -20,-15 L-20,-45 Z" fill="#fef08a" opacity="0.9"/>
    </g>
  </g>

  <!-- Small text label 'CARTA' in base -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#a1a1aa" text-anchor="middle" letter-spacing="8">CARTA</text>
</svg>
